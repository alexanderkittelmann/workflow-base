name: Build snapshot reusable workflow

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      docker_image_name:
        required: true
        type: string
      maven_internal-apis_repo_url:
        required: true
        type: string
      sonar_project_key:
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: '["ubuntu-latest"]'
      # Build JDK major (setup-java `java-version`). Additive: defaults to '21'
      # so existing callers are unaffected; a caller compiling at a newer source
      # level (a repo whose pom.xml <maven.compiler.release> is 25) passes
      # `java-version: '25'` to build on that JDK. Keep it a bare major string.
      java-version:
        required: false
        type: string
        default: '21'
      # Optional: push the snapshot image to a plain-HTTP registry reachable from
      # the runner (a self-hosted Nexus) INSTEAD of ghcr.io. Leave it unset and
      # this workflow behaves exactly as before -- the input is additive, so
      # existing callers are unaffected.
      #
      # Expects `<host>:<port>`, no scheme and no trailing slash, e.g.
      # `192.168.188.192:32000`. The image is pushed as
      # `<docker_registry>/<docker_image_name>` -- WITHOUT the ghcr `<owner>/`
      # segment, since a self-hosted registry has no owner namespace.
      #
      # Requires the runner to expose the registry password in its environment as
      # NEXUS_RUNNER_PASSWORD (see the auth step for why that is an environment
      # value rather than a secret input).
      docker_registry:
        required: false
        type: string
        default: ''
      docker_registry_user:
        required: false
        type: string
        default: 'hotstox-runner'
      # Sonar runs on push:main ONLY -> the self-hosted SonarQube Community Build
      # (BE#696 / hotstox-frontend#1053). The former hybrid routing (v1.3.0) also
      # analysed PRs on SonarCloud, but SonarCloud's free-tier LOC cap is exceeded
      # org-wide across `akindustries` (summed over every project), so its PR
      # analysis fails permanently ("Number of lines exceeded") and cannot be
      # recovered per-PR. Pre-merge gating now lives in the Maven build
      # (`mvn verify` -> tests + `jacoco:check`); the self-hosted main scan remains
      # the full, uncapped analysis and feeds IDE SonarLint connected mode.
      # Community Build has no branch mode, so main is the only branch it analyses
      # anyway. (This drops the v1.3.0 SonarCloud PR path -- `sonar_host_url_pr` /
      # `sonar_organization` inputs + the `SONAR_TOKEN_SONARCLOUD` secret are gone.)
      #
      # Self-hosted host for the push:main scan -- e.g. the tailnet ingress
      # (https://sonarqube.tail78193f.ts.net), reachable from the self-hosted
      # runner. REQUIRED with NO default deliberately: a default would be a silent
      # fallback that masks a misconfigured/unreachable self-hosted server by
      # quietly retargeting a different host. No trailing slash.
      sonar_host_url_main:
        required: true
        type: string
      # Opt-in PR Sonar check (workflow-base#28). Community Build has no PR
      # analysis and the mc1arke branch plugin lags the server version, so a
      # same-repo, non-Dependabot PR is scanned into a per-PR SCRATCH project
      # `<sonar_project_key>-pr-<N>` on the same host. The caller then runs the
      # `sonar-pr-new-issues` action (this repo) with the
      # `sonar_pr_project_key` output, which fails the PR on issues on changed
      # lines only. Default false: existing callers are unaffected.
      sonar_pr_scan:
        required: false
        type: boolean
        default: false
    outputs:
      # The scratch project the PR scan uploaded to; empty when no PR scan ran
      # (push, Dependabot, fork PR, or sonar_pr_scan off). Gate the caller's
      # check job on it being non-empty.
      sonar_pr_project_key:
        value: ${{ jobs.build-java-maven-snapshot.outputs.sonar_pr_project_key }}
    secrets:
      ACCESS_TOKEN:
        required: true
      # Self-hosted SonarQube analysis token. Sonar runs on push:main only
      # (BE#696), so this is the only Sonar secret needed -- the SonarCloud PR
      # token (SONAR_TOKEN_SONARCLOUD) was removed with the PR path.
      SONAR_TOKEN:
        required: true
jobs:
  build-java-maven-snapshot:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      sonar_pr_project_key: ${{ steps.sonar-pr.outputs.key }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Decides once whether this run does the PR scan (workflow-base#28); every
      # PR-scan step below gates on the key being non-empty. Fork PRs and
      # Dependabot get no secrets, so they are left out like on the main path.
      - name: Sonar PR scan target
        id: sonar-pr
        if: inputs.sonar_pr_scan && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        run: echo "key=${{ inputs.sonar_project_key }}-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      # Fail fast: the SonarQube scan runs only after `mvn clean package
      # verify` (~3 min), so an expired/missing SONAR_TOKEN otherwise burns
      # the whole build before surfacing. Validate the token up front -- the
      # scan itself still runs late because it needs the build/coverage
      # output. Same dependabot carve-out as the scan + cache steps (those
      # runs don't receive repository secrets).
      #
      # Branch on the HTTP STATUS, not the body (FE#702). This step used to
      # `curl -sS` (no -f, no -w) and grep the body for `"valid":true`, so ANY
      # non-JSON response missed the grep and was reported as an invalid token.
      # On 2026-07-16 SonarCloud 504'd and this blocked two PRs for an hour while
      # blaming a perfectly healthy secret -- and because the step fails ~40s in,
      # the whole suite was skipped, hiding any real regression behind the outage.
      # A bad credential must still fail fast; an outage must not.
      # Both Sonar paths (push:main, and the opt-in PR scan of workflow-base#28)
      # target the same self-hosted host + token, so the preflight validates it
      # directly -- no per-event ternary. It gates on the same conditions as the
      # two scan steps below.
      - name: Validate Sonar token (fail fast)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || steps.sonar-pr.outputs.key != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url_main }}
        run: |
          [ -n "$SONAR_TOKEN" ] || { echo "::error::SONAR_TOKEN secret is empty"; exit 1; }
          body="$RUNNER_TEMP/sonar-validate.json"
          # curl's own failures (timeout, DNS, TLS) exit non-zero, and `-w` still
          # prints `000` for them -- those are outages, not bad credentials. Don't
          # append a fallback `000` on the failure path: curl already emitted one,
          # and the two concatenate into a nonsense `HTTP 000000` in the warning.
          if ! code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 \
                        -u "$SONAR_TOKEN:" \
                        "${SONAR_HOST_URL}/api/authentication/validate"); then
            code="${code:-000}"
          fi
          case "$code" in
            200)
              grep -q '"valid":true' "$body" \
                || { echo "::error::SONAR_TOKEN rejected by the Sonar server (valid:false) -- rotate the secret"; exit 1; }
              echo "Sonar token OK"
              ;;
            401|403)
              echo "::error::SONAR_TOKEN rejected by the Sonar server (HTTP $code) -- rotate the secret"
              exit 1
              ;;
            *)
              echo "::warning::Sonar server unreachable (HTTP $code) -- skipping the token preflight. \
          This is an outage, NOT a bad token; the scan step will surface any real problem."
              ;;
          esac

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          check-latest: true
          # No `cache: maven` on purpose. The self-hosted build runner is
          # persistent -- ~/.m2/repository already survives between jobs -- and
          # dependencies resolve from the in-cluster Nexus over the LAN
          # (infra#364). The setup-java cache instead tars ~/.m2 and uploads it
          # to GitHub's Actions Cache service every run; that save post-step
          # (the "Post Set up JDK" step) crossed the home uplink and took longer than
          # the build itself (2m32s vs 2m15s, run 31622380954). Dropping it
          # removes a pure-overhead internet round-trip. Re-add `cache: maven`
          # only when falling back to a GitHub-hosted (ephemeral) runner.

      # Sonar's scanner CLI downloads a private JRE + plugins (~100 MB) into
      # ~/.sonar/cache on first run. Restore that BEFORE the SonarQube scan
      # step so the JRE comes from cache instead of the network. (The
      # previous workflow had this step at the very end of the job, so the
      # save worked but the restore never fired in time.)
      - name: Cache SonarQube packages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]') || steps.sonar-pr.outputs.key != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: maven-settings
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [{
                "id": "github",
                "username": "${{ github.repository_owner }}",
                "password": "${{ secrets.ACCESS_TOKEN }}"
            },
            {
                "id": "nexus",
                "username": "hotstox-runner",
                "password": "${env.NEXUS_RUNNER_PASSWORD}"
            }]
          # internal-apis SDK now resolves from the in-cluster Nexus (maven-public
          # group) instead of GitHub Packages (infra#364). The server password is
          # the LITERAL string `${env.NEXUS_RUNNER_PASSWORD}` -- Maven interpolates
          # it from the self-hosted runner's on-node environment at resolve time
          # (same pattern as the internal-apis release workflow). It is NOT a
          # `secrets.*`, so it cannot be passed via `${{ }}`; the literal also
          # keeps the real password out of the written settings.xml.
          repositories: '[{"id":"nexus","name":"nexus","url":"${{ inputs.maven_internal-apis_repo_url }}","snapshots":{"enabled":true}}]'
          # Nexus is served over plain HTTP (LAN NodePort). Maven 3.8.1+ ships a
          # built-in `maven-default-http-blocker` mirror (mirrorOf
          # `external:http:*`) that refuses HTTP repositories. Redefine that id
          # with an inert mirrorOf so this user-settings entry overrides the
          # global blocker (settings merge is by id) and the LAN-IP HTTP repo is
          # allowed. Maven Central stays HTTPS + direct, unmirrored.
          mirrors: |
            [{
                "id": "maven-default-http-blocker",
                "name": "nexus-http-unblock",
                "mirrorOf": "dummy-disabled-http-blocker",
                "url": "http://0.0.0.0/"
            }]
          githubServer: false

      # Pin Maven to the repo's committed wrapper (./mvnw) when present, so the
      # build runs the version-controlled Maven (e.g. 3.9.10) instead of the
      # runner's ambient `mvn`. Self-hosted runners install Maven via
      # `apt-get install maven`, which can resolve an ancient surefire (2.17)
      # that silently discovers ZERO JUnit 5 tests -> empty JaCoCo -> 0% Sonar
      # coverage while the build still goes green. The wrapper makes Maven
      # identical on GitHub-hosted and self-hosted runners. Repos without a
      # wrapper fall back to ambient `mvn`.
      - name: Resolve Maven (prefer the committed wrapper)
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "MVN=./mvnw" >> "$GITHUB_ENV"
          else
            echo "MVN=mvn" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        run: $MVN clean package verify

      # Self-hosted SonarQube scan -- push:main ONLY (BE#696; the SonarCloud PR
      # path was removed). Dependabot runs don't receive secrets, so they skip too.
      # No -Dsonar.organization: organization is a SonarCloud-only concept and the
      # self-hosted instance rejects it.
      - name: SonarQube scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url_main }}
        run: $MVN org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=${{ inputs.sonar_project_key }} -Dsonar.host.url="$SONAR_HOST_URL"

      # PR scan into the per-PR scratch project (workflow-base#28), same host +
      # token as the main scan. `sonar.scm.revision` pins the analysis to the
      # merge commit under test, which is what the caller's `sonar-pr-new-issues`
      # check waits for. continue-on-error: a Sonar hiccup must not red the
      # build; the check reports a missing analysis itself (and an unreachable
      # server there is a warning, not a failure).
      - name: SonarQube PR scan (scratch project)
        if: steps.sonar-pr.outputs.key != ''
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url_main }}
          SONAR_PR_KEY: ${{ steps.sonar-pr.outputs.key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          $MVN org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey="$SONAR_PR_KEY"
          -Dsonar.projectName="$SONAR_PR_KEY (PR $PR_NUMBER, scratch)"
          -Dsonar.scm.revision="$GITHUB_SHA"
          -Dsonar.host.url="$SONAR_HOST_URL"

      - name: Get the version
        id: tag
        run: echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_ENV

      # Multi-arch Docker buildx (linux/arm64 + linux/amd64) is the most
      # expensive stage on this workflow. PR pushes don't need a published
      # image -- the maven build + tests above cover correctness. Skip the
      # Docker steps unless we're publishing from main, to save Actions
      # minutes (mirrors hotstox-frontend build-test.yml).
      # Optional self-hosted-registry auth (infra#338 Phase B). No-op unless the
      # caller passes `docker_registry`, so existing callers are unaffected.
      #
      # The credential is written straight into a job-scoped DOCKER_CONFIG rather
      # than via `docker login`: the CLI's login round-trips the DAEMON, which
      # refuses a plain-HTTP registry unless it is in daemon.json
      # insecure-registries. buildkit does the push itself and only reads the
      # credential file, so this needs no host-level change. A job-scoped config
      # also keeps the credential out of a shared runner's ~/.docker/config.json.
      #
      # ORDER MATTERS: DOCKER_CONFIG must be exported BEFORE setup-buildx-action,
      # because buildx stores builder state under $DOCKER_CONFIG/buildx. Setting
      # it afterwards makes the build step (and the action's own cleanup
      # post-step) fail with `ERROR: no builder "..." found`.
      - name: Configure self-hosted registry auth
        id: registry-auth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ inputs.docker_registry }}
          REGISTRY_USER: ${{ inputs.docker_registry_user }}
        run: |
          set -euo pipefail
          # Emit an (empty) buildkitd config either way, so the buildx step below
          # can reference the output unconditionally.
          {
            echo "buildkitd_config<<__EOF__"
          } > "${RUNNER_TEMP}/bk.txt"
          if [ -z "${REGISTRY}" ]; then
            echo "__EOF__" >> "${RUNNER_TEMP}/bk.txt"
            cat "${RUNNER_TEMP}/bk.txt" >> "$GITHUB_OUTPUT"
            echo "No docker_registry input — pushing to ghcr.io as before."
            exit 0
          fi
          # NEXUS_RUNNER_PASSWORD comes from the self-hosted runner's on-node
          # service environment, not `secrets.*` -- the registry is node-local, so
          # a repository secret would be unusable from a GitHub-hosted runner
          # anyway. That also means GitHub does not auto-mask it.
          if [ -z "${NEXUS_RUNNER_PASSWORD:-}" ]; then
            echo "::error::docker_registry='${REGISTRY}' was requested but NEXUS_RUNNER_PASSWORD is not set on this runner."
            exit 1
          fi
          echo "::add-mask::${NEXUS_RUNNER_PASSWORD}"
          auth=$(printf '%s:%s' "${REGISTRY_USER}" "${NEXUS_RUNNER_PASSWORD}" | base64 -w0)
          echo "::add-mask::${auth}"
          cfg="${RUNNER_TEMP}/docker-config"
          mkdir -p "$cfg"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY}" "${auth}" > "${cfg}/config.json"
          chmod 600 "${cfg}/config.json"
          echo "DOCKER_CONFIG=${cfg}" >> "$GITHUB_ENV"
          # buildkit does not read the docker daemon's insecure-registries; a
          # plain-HTTP registry must be declared in buildkit's own config or the
          # push fails the TLS handshake.
          {
            printf '[registry."%s"]\n' "${REGISTRY}"
            printf '  http = true\n'
            echo "__EOF__"
          } >> "${RUNNER_TEMP}/bk.txt"
          cat "${RUNNER_TEMP}/bk.txt" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Self-cleaning: creates a multi-arch-capable builder AND removes it in
        # its post-step, so the self-hosted runner doesn't accumulate orphaned
        # `docker buildx create --use` builders (infra#180 / workflow-base#10).
        uses: docker/setup-buildx-action@v4
        with:
          # Empty (and therefore inert) unless the caller opted in via
          # `docker_registry` -- see the auth step above.
          buildkitd-config-inline: ${{ steps.registry-auth.outputs.buildkitd_config }}

      # Pushes two tags: the mutable branch tag (`:main`) for anything that still
      # floats, plus an immutable `:sha-<7>` tag. GitOps CD (infra#161) pins dev's
      # overlay to the `:sha-<7>` — a floating `:main` never changes the manifest
      # `image:` string, so the reconciler would never detect a new image. Same
      # sha tag format as hotstox-frontend's build-test.yml.
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ./
        env:
          GITHUB_ACTOR: ${{ secrets.GIT_PACKAGES_USER }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GIT_PACKAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ACTUAL_TAG: ${{ env.VERSION }}
          REGISTRY: ${{ inputs.docker_registry }}
        run: |
          if [ -n "${REGISTRY}" ]; then
            # Self-hosted registry (infra#338 Phase B). No `docker login` -- the
            # credential was already written into the job-scoped DOCKER_CONFIG,
            # and login would round-trip the daemon, which refuses plain HTTP.
            # No `<owner>/` segment: a self-hosted registry has no owner namespace.
            image="${REGISTRY}/${{ inputs.docker_image_name }}"
          else
            docker login ghcr.io/$GITHUB_ACTOR -u=$GITHUB_ACTOR -p=$GIT_PACKAGE_PASSWORD
            image="ghcr.io/$GITHUB_OWNER/${{ inputs.docker_image_name }}"
          fi
          sha_tag="sha-${GITHUB_SHA::7}"
          docker buildx build --platform linux/arm64,linux/amd64 \
            -t "${image}:${ACTUAL_TAG}" \
            -t "${image}:${sha_tag}" \
            --push .
          echo "Published ${image}:${ACTUAL_TAG} and ${image}:${sha_tag}" >> "${GITHUB_STEP_SUMMARY}"
